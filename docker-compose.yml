version: "3.9"

services:
  api:
    container_name: zera-backend-api
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_PORT: ${APP_PORT:-3000}
    dns:
      - "${DOCKER_DNS_1:-1.1.1.1}"
      - "${DOCKER_DNS_2:-8.8.8.8}"
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:${APP_PORT:-3000}/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
